server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Job 1: Captura de logs del sistema
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: server-01
          __path__: /var/log/*log

  # Job 2: Logs simulados de Cloud (Pipeline JSON)
  - job_name: cloud_events
    static_configs:
      - targets:
          - localhost
        labels:
          job: aws_cloudtrail_sim
          env: production
          __path__: /var/cloud-logs/*.json
    pipeline_stages:
      - json:
          expressions:
            level: severity
            action: eventName
      - labels:
          level:
          action:
